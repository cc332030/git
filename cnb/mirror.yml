
.mirror: &mirror
  - env:
      REPOS: github.com
    imports:
      # 从密钥仓库导入 GITHUB_TOKEN（Secret 仓库，仅流水线可访问）
      - https://cnb.cool/cc332030/secrets/-/blob/main/secrets.yml
    services:
      - docker
    docker:
      image: docker.cnb.cool/cc332030/linux
    stages:
      - name: check-env
        script: |
          echo "check GITHUB_TOKEN"
          if [ -z "${GITHUB_TOKEN}" ]; then
            echo "ERROR: GITHUB_TOKEN is not injected, please check imports from cc332030/secrets"
            exit 1
          fi
          echo "GITHUB_TOKEN is injected"
      - name: mirror
        script: |
          # 同步范围 = 当前分支 + tags，因此需要显式确定「当前分支」。
          # 优先使用平台内置变量 CNB_BRANCH；缺失时回退到工作区的 HEAD。
          BRANCH="${CNB_BRANCH}"
          if [ -z "${BRANCH}" ]; then
            BRANCH=$(git symbolic-ref --short HEAD 2>/dev/null || true)
          fi
          if [ -z "${BRANCH}" ]; then
            echo "ERROR: unable to determine current branch, please set BRANCH" >&2
            exit 1
          fi
          echo "BRANCH: ${BRANCH}"
          export BRANCH

          # 兼容：优先使用本仓库脚本，不存在时再取远程
          if [ -f "script/mirror/linux/push-github-https.sh" ]; then
            echo "use local script: script/mirror/linux/push-github-https.sh"
            sh script/mirror/linux/push-github-https.sh
          else
            echo "use remote script: push-github-https.sh"
            curl -sL https://github.com/cc332030/git/raw/master/script/mirror/linux/push-github-https.sh | sh
          fi

"(main|master)":
  push:
    - <<: *mirror
