
name: mirror

on:
  workflow_call:
    inputs:
      destination:
        required: false
        type: string
    secrets:
      SSH_PRIVATE_KEY:
        required: true
      CNB_SYNC_TOKEN:
        required: false

jobs:
  mirror:
    name: mirror
    runs-on: ubuntu-latest
    steps:
      # 仅当项目名为 git 时，才 checkout 当前分支以取用当前分支的脚本
      - name: checkout
        if: ${{ github.event.repository.name == 'git' }}
        uses: actions/checkout@v4
      - name: init-ssh-pre
        run: curl -sL https://github.com/cc332030/linux/raw/master/script/init-ssh/init-ssh-pre.sh | sudo sh
      - name: init-ssh
        run: curl -sL https://github.com/cc332030/linux/raw/master/script/init-ssh/init-ssh.sh | sh
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: mirror
        run: |
          # 优先使用当前分支的脚本，不存在时再取远程 master
          if [ -f "script/mirror/linux/mirror-github.sh" ]; then
            echo "use local script: script/mirror/linux/mirror-github.sh"
            sh script/mirror/linux/mirror-github.sh
          else
            echo "use remote script: mirror-github.sh"
            curl -sL https://github.com/cc332030/git/raw/master/script/mirror/linux/mirror-github.sh | sh
          fi
        env:
          CNB_SYNC_TOKEN: ${{ secrets.CNB_SYNC_TOKEN }}
          DESTINATION: ${{ inputs.destination }}
      - name: init-ssh-clean
        if: ${{ always() }}
        run: curl -sL https://github.com/cc332030/linux/raw/master/script/init-ssh/init-ssh-clean.sh | sh
