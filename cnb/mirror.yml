
.mirror: &mirror
  - env:
      REPOS: github.com
      GITHUB_TOKEN: ${GITHUB_TOKEN}
    services:
      - docker
    docker:
      image: docker.cnb.cool/cc332030/linux
    stages:
      - name: check-env
        script: |
          echo "check GITHUB_TOKEN"
          if [ -z "${GITHUB_TOKEN}" ]; then
            echo "ERROR: GITHUB_TOKEN is not injected, please add it to project variables"
            exit 1
          fi
          echo "GITHUB_TOKEN is injected"
      - name: mirror
        script: |
          curl -sL https://github.com/cc332030/git/raw/master/script/mirror/linux/mirror-github-https.sh | sh

"(main|master)":
#"disable":
  push:
    - <<: *mirror
  pull_request.merged:
    - <<: *mirror
$:
  tag_push:
    - <<: *mirror
