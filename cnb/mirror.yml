
.mirror: &mirror
  - env:
      REPOS: github.com
    imports:
      # 从密钥仓库导入 GITHUB_TOKEN（Secret 仓库，仅流水线可访问）
      - https://cnb.cool/cc332030/secrets/-/blob/main/secrets.yml
    services:
      - docker
    docker:
      image: docker.cnb.cool/cc332030/linux
    stages:
      - name: check-env
        script: |
          echo "check GITHUB_TOKEN"
          if [ -z "${GITHUB_TOKEN}" ]; then
            echo "ERROR: GITHUB_TOKEN is not injected, please check imports from cc332030/secrets"
            exit 1
          fi
          echo "GITHUB_TOKEN is injected"
      - name: mirror
        script: |
          # 兼容：优先使用本仓库脚本，不存在时再取远程
          if [ -f "script/mirror/linux/mirror-github-https.sh" ]; then
            echo "use local script: script/mirror/linux/mirror-github-https.sh"
            sh script/mirror/linux/mirror-github-https.sh
          else
            echo "use remote script: mirror-github-https.sh"
            curl -sL https://github.com/cc332030/git/raw/master/script/mirror/linux/mirror-github-https.sh | sh
          fi

"(main|master)":
#"disable":
  push:
    - <<: *mirror
